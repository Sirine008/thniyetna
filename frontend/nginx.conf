server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shared reverse proxy. M4 can call /api/... without hardcoding localhost:8000.
    location = /api/realtime/stream {
        proxy_pass http://api:8000/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # RAG assistant: Ollama on the host CPU takes 30–90 s per answer (default proxy timeout is 60 s).
    location ^~ /api/assistant/ {
        proxy_pass http://api:8000/assistant/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Persistent media is served by FastAPI from the shared media volume.
    location /media/files/ {
        proxy_pass http://api:8000/media/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Avoid an SPA fallback loop if index.html is ever missing.
    location = /index.html {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
